ERROR-TERMS-NOT-EXISTS=저장된 이용약관 정보가 없습니다.
ERROR-TERMS-EMPTY-TITLE=이용약관의 제목을 입력해주세요.
ERROR-TERMS-EMPTY-CONTENTS=이용약관의 내용을 입력해주세요.
ERROR-TERMS-EMPTY-CONTENT-TYPE=이용약관 내용의 유형을 입력해주세요.
ERROR-TERMS-EMPTY-ORDER-NO=이용약관 출력 순번을 입력해주세요. 출력 순번은 1 이상의 숫자입니다.
ERROR-TERMS-EMPTY-USE-YN=이용약관 사용 여부를 입력해주세요. 이용약관 사용 여부는 Y 또는 N를 입력할 수 있습니다.
ERROR-TERMS-EMPTY-REQUIRE-YN=이용약관 필수 여부를 입력해주세요. 이용약관 필수 여부는 Y 또는 N를 입력할 수 있습니다.
ERROR-TERMS-NOT-VALID-USE-YN=이용약관 사용 여부는 Y 또는 N만 입력할 수 있습니다.
ERROR-TERMS-NOT-VALID-REQUIRE-YN=이용약관 필수 여부는 Y 또는 N만 입력할 수 있습니다.
ERROR-TERMS-DUPLICATE-TITLE=이용약관의 제목이 이미 사용중입니다.
ERROR-TERMS-DUPLICATE-ORDER-NO=이용약관의 출력 순서가 중복됩니다.